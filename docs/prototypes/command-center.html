const workspaces=[{id:'home',name:'Home',icon:'home',desc:'Your search at a glance. Focus on the next useful step.',views:['Overview','My Actions','Recent Activity']},{id:'jobs',name:'Find Jobs',icon:'search',desc:'Discover the right opportunities, with evidence behind every match.',views:['Best Matches','Shortlisted','All Jobs','Needs Verification']},{id:'applications',name:'Applications',icon:'applications',desc:'Five applications at a time. Prepare, resolve and review.',views:['Priority Queue','Preparing','Ready to Review','Applied','Follow-ups']},{id:'inbox',name:'Inbox & Drafts',icon:'inbox',desc:'Recruiter conversations first. Every draft stays in your control.',views:['Recruiter Inbox','Job Alerts','Draft Approvals','Draft History']},{id:'sources',name:'Sources & Activity',icon:'sources',desc:'Know what was checked, what failed and what needs verification.',views:['Source Health','Run History','Schedules','Verification Backlog']},{id:'profile',name:'My Profile',icon:'profile',desc:'Your career evidence, documents and reusable answers in one place.',views:['Career Facts','Documents','Saved Answers','Preferences']}];

function metric(label,value,note,ic='sources'){return `<article class="surface metric"><div class="metric-label">${label}${icon(ic)}</div><strong>${value}</strong><small>${note}</small></article>`}
function heading(w,view){const actions={home:`<button class="secondary-action" data-demo="Refresh overview">${icon('refresh')} Refresh</button><button class="primary" data-go="applications">Review my actions ${icon('arrow')}</button>`,jobs:`<button class="secondary-action" data-demo="Saved searches">Saved searches</button>`,applications:`<button class="secondary-action" data-demo="Refresh progress">${icon('refresh')} Refresh progress</button><button class="primary desktop-action" data-demo="Prepare next batch">Prepare next batch</button>`,inbox:`<button class="secondary-action" data-demo="Refresh inbox">${icon('refresh')} Refresh inbox</button>`,sources:`<button class="secondary-action" data-demo="View source configuration">Source settings</button><button class="primary desktop-action" data-demo="Run discovery">Run discovery</button>`,profile:`<button class="secondary-action" data-demo="Profile history">View history</button><button class="primary desktop-action" data-demo="Edit verified profile">Edit profile</button>`};return `<div class="page-heading"><div><h1>${w.name}</h1><p>${w.desc}</p></div><div class="heading-actions">${actions[w.id]}</div></div><nav class="subnav" aria-label="Section views">${w.views.map(v=>`<button data-view="${v}" class="${v===view?'active':''}" ${v===view?'aria-current="page"':''}>${v}${({Preparing:'5','Ready to Review':'2','Recruiter Inbox':'3','Needs Verification':'18','My Actions':'3','Draft Approvals':'2'})[v]?badge(({Preparing:'5','Ready to Review':'2','Recruiter Inbox':'3','Needs Verification':'18','My Actions':'3','Draft Approvals':'2'})[v]):''}</button>`).join('')}</nav><div id="search-feedback" class="search-feedback" role="status"></div>`}
function home(){return `<div class="metrics">${metric('Verified matches','12','Evidence checks passed','shield')}${metric('Ready for review','2','In your current batch','applications')}${metric('Your actions','3',badge('Needs attention','warn')+' Answers & draft reviews','alert')}${metric('Recruiter requests','3','1 received deadline','inbox')}</div><div class="grid-two"><section class="surface panel"><div class="panel-heading"><h2>What needs your attention</h2><a href="#home/my-actions">View all actions ${icon('arrow')}</a></div><div class="row"><div class="symbol amber">${icon('applications')}</div><div><h3>Two applications are ready to review</h3><p>Atlas Labs and Meridian · Batch 08<br>Check the employer forms before submitting yourself.</p></div><button data-go="applications" data-sub="Ready to Review">Review forms</button></div><div class="row"><div class="symbol amber">${icon('profile')}</div><div><h3>One answer is holding up your batch</h3><p>Notice period · needed for Northstar Systems<br>Saved facts were checked first.</p></div><button data-demo="Consolidated batch question">Answer question</button></div><div class="row"><div class="symbol blue-symbol">${icon('inbox')}</div><div><h3>A recruiter requested your availability</h3><p>Solstice Software · interview coordination<br>Explicit response requested by 22 Oct.</p></div><button data-go="inbox">Read conversation</button></div><div class="inline-note">${icon('shield')}No applications or emails have been sent automatically.</div></section><section class="surface panel timeline"><div class="panel-heading"><h2>Recent activity</h2><a href="#home/recent-activity">View history</a></div><div class="row"><div><h3>Batch 08 preparation completed</h3><p>5 inspected · 2 ready · 1 needs your answer · 2 research checks</p><time>Today, 10:42 IST · Local worker</time></div></div><div class="row"><div><h3>Source check completed</h3><p>6 boards checked · 14 roles discovered · 1 board needs attention</p><time>Today, 10:28 IST · Run #042</time></div></div><div class="row"><div><h3>Resume reference verified</h3><p>Approved local document is available. Original bytes retained.</p><time>Today, 09:54 IST · Document check</time></div></div><div class="row"><div><h3>Application marked as applied</h3><p>Harbor Technologies · recorded manually by you</p><time>Yesterday, 16:20 IST · Manual tracking</time></div></div></section></div><div class="overview-bottom"><div class="surface">${icon('sources')}<div><strong>Sources are up to date</strong><span class="small muted">Last successful check · 10:28 IST</span></div></div><div class="surface">${icon('clock')}<div><strong>Worker idle</strong><span class="small muted">Batch progress is safely retained</span></div></div><div class="surface">${icon('calendar')}<div><strong>Schedules disabled</strong><span class="small muted">No background run is promised</span></div></div></div>`}
const roles=[['AL','Atlas Labs','Senior Frontend Engineer','Bengaluru · Hybrid','92','Verified eligible','good','Angular · TypeScript · Design systems'],['MS','Meridian Software','Frontend Platform Engineer','India · Remote','88','Verified eligible','good','React · Performance · Platform'],['NS','Northstar Systems','Senior Software Engineer, Web','Pune · Hybrid','85','Needs verification','warn','Angular · Accessibility · Testing'],['SS','Solstice Software','UI Engineering Lead','Hyderabad · Hybrid','81','Needs verification','warn','Architecture · Mentoring · Frontend']];
function roleCard(r,i,selected=i===0){return `<button class="surface job-card ${selected?'selected':''}" data-role="${i}" aria-pressed="${selected}"><div class="company-line"><span class="company-mark">${r[0]}</span><div><p>${r[1]}</p><small>Direct employer listing</small></div><span class="score">${r[4]}<small>fit / 100</small></span></div><h3>${r[2]}</h3><p>${r[3]}</p><div class="tags">${badge(r[5],r[6])}${i===0?badge('Shortlisted'):''}</div><footer><span>${r[7]}</span></footer><footer><span>Checked today</span><span>${i===0?'Selected role':'View details →'}</span></footer></button>`}
function roleDetail(i=0){const r=roles[i];return `<div class="company-line"><span class="company-mark">${r[0]}</span><div><p>${r[1]}</p><small>Official careers page · Vacancy #DEMO-${104+i}</small></div><button class="icon-button" style="margin-left:auto" data-demo="Save role" aria-label="Save selected role">${icon('file')}</button></div><h2>${r[2]}</h2><div class="location">${r[3]} &nbsp;·&nbsp; Full-time &nbsp;·&nbsp; Permanent role</div><div class="tags">${badge(r[5],r[6])}${badge('Strong skills match','blue')}</div><div class="detail-actions"><button class="primary" data-demo="Open employer listing">Open employer listing ${icon('external')}</button><button data-demo="Review preparation eligibility">Review preparation</button></div><section class="detail-section"><h3>Why this role fits</h3><div class="evidence-row"><span class="check">✓</span><div><strong>Frontend delivery & component architecture</strong><br>Matches accepted career facts with user-confirmed provenance.</div></div><div class="evidence-row"><span class="check">✓</span><div><strong>TypeScript, Angular & automated testing</strong><br>Supported by verified skill evidence in your profile.</div></div><div class="evidence-row"><span class="check">✓</span><div><strong>Experience requirement</strong><br>Required tenure checked against accepted employment facts.</div></div></section><section class="detail-section"><h3>Eligibility checks</h3><div class="gate-grid"><div>Location eligibility<strong style="color:#286c51">✓ India accepted</strong></div><div>Mandatory requirements<strong style="color:${i>1?'#936925':'#286c51'}">${i>1?'Unresolved · not eligible yet':'✓ Verified pass'}</strong></div><div>Employer & vacancy<strong style="color:#286c51">✓ Official listing verified</strong></div><div>Direct employment<strong style="color:#286c51">✓ Evidence retained</strong></div></div></section><section class="detail-section"><h3>Skill gaps & things to review</h3><p>GraphQL is preferred, with no accepted professional evidence in your profile. It is shown as a gap and does not block mandatory eligibility.</p></section><section class="detail-section"><h3>Evidence & provenance</h3><p>Official job description checked today, 10:12 IST.<br>Compared with accepted profile revision 04. <a href="#" data-demo="Review evidence sources">Review evidence sources</a></p></section>`}
function jobs(){const indexes=subview==='Shortlisted'?[0]:subview==='Needs Verification'?[2,3]:[0,1,2,3];const selected=indexes[0];const caption=subview==='Shortlisted'?'Your saved shortlist · 1 illustrative role':subview==='Needs Verification'?'2 unresolved roles · preparation blocked':subview==='All Jobs'?'All discovered roles · 4 illustrative records':'Ranked matches · 2 verified + 2 unresolved shown';return `<div class="toolbar"><label class="searchbox">${icon('search')}<input placeholder="Search title, company or skill" aria-label="Search proposed roles"></label><div class="toolbar-group"><button data-demo="Job filters">${icon('filter')} Filters ${badge('3')}</button><button data-demo="Sort results">Fit: highest first ↓</button></div></div><div class="results-meta"><span>${caption}</span><span>Last checked 10:28 IST</span></div><div class="split"><div class="job-results">${indexes.map((i,n)=>roleCard(roles[i],i,n===0)).join('')}</div><aside class="surface job-detail" id="role-detail" aria-label="Selected role details">${roleDetail(selected)}</aside></div>`}
const applications=[['AL','Atlas Labs','Senior Frontend Engineer','Ready for your review','good','12 of 12 fields inspected','100','No unresolved blockers. Review the employer form.','Review form'],['MS','Meridian Software','Frontend Platform Engineer','Ready for your review','good','10 of 10 fields inspected','100','Document acceptance verified. Review before you submit.','Review form'],['NS','Northstar Systems','Senior Software Engineer, Web','Your answer needed','warn','8 of 9 fields inspected','88','You · confirm your current notice period.','Answer question'],['SS','Solstice Software','UI Engineering Lead','Research check','blue','7 of 10 fields inspected','70','Agent · verify direct permanent employment.','View blockers'],['OT','Orchard Technology & Digital Experience','Senior Frontend Platform & Accessibility Engineer','Session lost','bad','6 of 10 fields last inspected','60','Agent · recover session; previous application history retained.','Review recovery']];
function applicationCard(r,i){return `<article class="surface application"><div class="application-top"><span class="company-mark">${r[0]}</span><div class="application-title"><h3>${r[2]}</h3><p>${r[1]} · Application ${i+1} of 5</p></div>${badge(r[3],r[4])}</div><div class="application-middle"><div class="progress"><span style="width:${r[6]}%"></span></div><span>${r[5]}</span><span>Last check 10:4${i} IST</span></div><div class="application-footer"><p>${r[7]}</p><button ${i<2?'class="primary"':''} data-demo="${r[8]}">${r[8]} ${icon('arrow')}</button></div><details class="field-details"><summary>Form details & inspection (${i+8} fields) · Documents · Manual history</summary><ul><li>First name · accepted profile fact · inspection retained</li><li>Contact details · verified value, employer acceptance requires inspection</li><li>Notice period · ${i===2?'user answer required':'current form readback retained'}</li><li>Documents · approved resume reference, no automatic replacement</li><li>Consent and declarations · manual review required</li><li>Raw field inventory: NEEDS INSPECTION remains unresolved when not checked.</li></ul><p style="margin-top:12px">${badge('No submission inferred')}</p><button data-demo="Manual application history" style="margin-top:12px">Troubleshooting & manual history</button></details></article>`}

function conversationDetail(i=0){const m=messages[i];return `<div class="tags">${badge(i===0?'Response requested':'Received recruiter message',i===0?'warn':'blue')}${badge('Sender identity needs verification')}</div><h2>${m[3]}</h2><div class="sender"><div class="avatar">${m[0]}</div><div><strong>${m[1]}</strong><small>${m[2]} · Retained received message</small></div></div><div class="message-body"><p>Hi Jordan,</p><p>${m[4]}</p><p>${i===0?'Our team is reviewing profiles for the UI Engineering Lead role. Please share your availability by 22 October so we can coordinate the conversation.':'Please review the original conversation for the full request and its context.'}</p><p>Thank you,<br>${m[1].split(' · ')[0]}</p></div><div class="message-explanation"><strong>Why this needs attention</strong>${i===0?'An explicit interview request includes a response deadline. This is not an urgency score inferred from a job alert.':'Classification is based on retained received-message evidence.'}<br>Role link and sender identity must be verified before draft creation.</div><div class="detail-actions"><button class="primary" data-demo="Preview recruiter reply">Review reply draft</button><button data-demo="Open original conversation">Original conversation ${icon('external')}</button></div><div class="small muted" style="line-height:1.7">Drafts require an exact recipient, evidence and full-content approval. Nothing is sent automatically.</div>`}
function inbox(){return `<div class="toolbar"><label class="searchbox">${icon('search')}<input placeholder="Search retained conversations" aria-label="Search proposed conversations"></label><div class="toolbar-group"><button data-demo="Recruiter filters">${icon('filter')} Needs attention</button><span class="small muted">3 recruiter conversations · retained locally</span></div></div><div class="surface inbox-layout"><div class="inbox-list"><div class="inbox-toolbar"><span>Recruiter conversations</span><span>Request priority ↓</span></div>${messages.map((m,i)=>`<button class="conversation ${i===0?'active':''}" data-conversation="${i}"><div class="conversation-top"><strong>${m[1].split(' · ')[0]}</strong><time>${m[2]}</time></div><h3>${m[3]}</h3><p>${m[4]}</p>${badge(m[5],m[6])}</button>`).join('')}<div class="panel small muted" style="line-height:1.7">Automated job alerts live in a separate view. This screen does not claim to cover unread Gmail.</div></div><article class="inbox-detail" id="conversation-detail">${conversationDetail()}</article></div>`}
const boards=[['Atlas Labs','Greenhouse · official board','Healthy','good','Today, 10:28','14 roles · 2 new','Next eligible tomorrow'],['Meridian Software','Lever · official board','Healthy','good','Today, 10:27','8 roles · 1 new','Next eligible tomorrow'],['Northstar Systems','SmartRecruiters · official board','Retry needed','warn','Today, 10:26','Last request timed out','Retry after cooldown'],['Solstice Software','Official employer careers','Healthy','good','Today, 10:25','6 roles · unchanged','Next eligible tomorrow'],['Orchard Technology','Manual source · no connector','Manual review','','Not scanned','No automated coverage','No scheduled run']];
function sources(){return `<div class="metrics">${metric('Configured boards','6','5 shown in this proposal','sources')}${metric('Healthy sources','4','Last completed source check','check')}${metric('Needs attention','1','Timeout · eligible for retry','alert')}${metric('Verification backlog','18','Unknown evidence stays unresolved','shield')}</div><div class="toolbar"><label class="searchbox">${icon('search')}<input placeholder="Search employer or source" aria-label="Search proposed sources"></label><div class="toolbar-group"><button data-demo="Source health filters">${icon('filter')} All health states</button><span class="small muted">Last run #042 · today, 10:28 IST</span></div></div><section class="surface"><div class="table-wrap" tabindex="0" role="region" aria-label="Source health table, scroll horizontally on small screens"><table class="table"><thead><tr><th>Employer / source</th><th>Health</th><th>Last attempt</th><th>Retained results</th><th>Next check / evidence</th></tr></thead><tbody>${boards.map(b=>`<tr><td><strong>${b[0]}</strong><small>${b[1]}</small></td><td>${badge(b[2],b[3])}</td><td>${b[4]}<small>${b[2]==='Healthy'?'Successful scan':'No success inferred'}</small></td><td>${b[5]}</td><td>${b[6]}<small><a href="#" data-demo="Source evidence for ${b[0]}">View evidence →</a></small></td></tr>`).join('')}</tbody></table></div><div class="source-footer"><span>Cooldowns show eligibility, not promised execution.</span><span>Showing 5 of 6 configured boards</span></div></section><div class="source-bottom"><section class="surface panel"><div class="panel-heading"><h2>Latest completed run</h2>${badge('Completed with warning','warn')}</div><p><strong style="color:#365463">Run #042 · Bounded discovery</strong><br>6 sources attempted · 14 roles discovered<br>One source failed independently; completed results were retained.</p><div style="margin-top:16px"><a href="#sources/run-history" class="small">Review run history ${icon('arrow')}</a></div></section><section class="surface panel"><div class="panel-heading"><h2>Scheduling status</h2>${badge('Disabled')}</div><p>No schedule is active in this proposal.<br>Stored cadence is not proof of an OS task or a future run. Activation requires separate approval.</p><div style="margin-top:16px"><a href="#sources/schedules" class="small">View schedule configuration ${icon('arrow')}</a></div></section></div>`}
function profile(){return `<section class="surface profile-summary"><div class="avatar">JD</div><div><h2>Jordan Demo</h2><p>Frontend & software engineering · India</p></div>${badge('Profile revision 04','good')}</section><div class="facts-grid"><section class="surface fact-group"><div class="panel-heading"><h2>Accepted career facts</h2>${badge('Verified evidence','good')}</div><div class="fact-row"><div class="fact-label">Experience</div><div class="fact-value">6 years · Software engineering<small>User-confirmed fact · accepted 15 Oct 2026</small></div></div><div class="fact-row"><div class="fact-label">Specialization</div><div class="fact-value">Frontend architecture & product delivery<small>Accepted employment evidence · source available</small></div></div><div class="fact-row"><div class="fact-label">Location</div><div class="fact-value">India · Open to remote & hybrid<small>User-confirmed preference · not work authorization</small></div></div><div class="fact-row"><div class="fact-label">Professional AI</div><div class="fact-value">No accepted professional tenure<small>Project evidence does not imply employer experience.</small></div></div><div class="provenance"><strong>Evidence stays attached to every fact</strong>Only accepted facts affect verified profile evidence. Imported resume proposals remain pending until you make an explicit decision.</div></section><div><section class="surface fact-group"><div class="panel-heading"><h2>Skills with evidence</h2><button data-demo="Review skill provenance" style="font-size:11px;padding:6px 9px">View sources</button></div><p class="small muted" style="line-height:1.6;margin:0">Professional skills supported by accepted facts</p><div class="tags">${['TypeScript','Angular','JavaScript','Accessibility','Automated testing','Component architecture'].map(s=>badge(s,'good')).join('')}</div><div class="detail-section"><h3>Learning & project skills</h3><div class="tags">${badge('GraphQL · project')}${badge('LLM workflows · learning')}</div><p style="margin-top:10px;font-size:11px">Shown separately. No professional duration is inferred.</p></div></section><section class="surface panel" style="margin-top:20px"><div class="panel-heading"><h2>Canonical documents</h2>${icon('file')}</div><div class="row"><div><h3>Approved resume.pdf</h3><p>Local file available · original bytes retained<br>Reference checked today at 09:54 IST</p></div></div><a href="#profile/documents" class="small" style="display:inline-block;margin-top:16px">Review documents & local parsing ${icon('arrow')}</a></section></div></div><section class="surface review-proposals"><div class="symbol amber">${icon('file')}</div><div><h3>3 extracted facts await your review</h3><p>Parser proposals never become verified facts automatically.</p></div><button data-demo="Review fact proposals">Review proposals ${icon('arrow')}</button></section>`}
function table(headers,rows){return `<section class="surface"><div class="table-wrap" tabindex="0" role="region" aria-label="${subview} table"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}
function alternate(){
 if(current==='home'&&subview==='My Actions')return `<section class="surface panel"><div class="panel-heading"><h2>Three decisions for you</h2>${badge('No agent research assigned to you')}</div>${applications.filter((_,i)=>i===0||i===2).map((r,i)=>`<div class="row"><div class="symbol amber">${icon(i?'profile':'applications')}</div><div><h3>${i?'Confirm your notice period':'Review two prepared employer forms'}</h3><p>${i?'Northstar · explicit answer required':'Atlas Labs & Meridian · you submit personally'}</p></div><button data-demo="Review action">${i?'Answer question':'Review forms'}</button></div>`).join('')}<div class="row"><div class="symbol blue-symbol">${icon('inbox')}</div><div><h3>Review recruiter reply</h3><p>Solstice Software · recipient identity still needs checking</p></div><button data-go="inbox">Read conversation</button></div></section>`;
 if(current==='home'&&subview==='Recent Activity')return table(['Time (IST)','Activity','Outcome','Evidence'],[['Today, 10:42','Batch 08 inspected',badge('2 ready · 3 blocked','warn'),'Local checkpoint retained'],['Today, 10:28','Discovery run #042',badge('Completed with warning','warn'),'6 boards · one timeout'],['Today, 09:54','Canonical document checked',badge('Available','good'),'Original bytes retained'],['Yesterday, 16:20','Manual status recorded',badge('User reported applied'),'No submission evidence inferred']]);
 if(current==='jobs')return jobs();
 if(current==='applications'&&subview==='Priority Queue')return `<div class="metrics">${metric('Eligible pending','12','Only verified-pass roles','shield')}${metric('Next batch','5','Strict persisted priority order','applications')}${metric('Verification queue','18','Not eligible for preparation','alert')}${metric('Active batch','08','2 ready · 3 blocked','clock')}</div>${table(['Rank / fit','Role','Eligibility','Priority reason','Action'],roles.map((r,i)=>[`${i+1} · ${r[4]}`,`<strong>${r[2]}</strong><small>${r[1]}</small>`,badge(r[5],r[6]),i<2?'Verified role fit · explicit evidence':'Verification blocks preparation',`<button data-demo="Queue role details">Details</button>`]))}<div class="inline-note">${icon('shield')}The next batch may contain fewer than five eligible jobs. Unknown requirements never pass.</div>`;
 if(current==='applications'&&subview==='Ready to Review')return `<div class="inline-note" style="margin:0 0 16px">${icon('shield')}Two inspected forms are ready. You review and submit each one personally.</div><div class="batch-list">${applications.slice(0,2).map(applicationCard).join('')}</div>`;
 if(current==='applications'&&subview==='Applied')return table(['Application','Recorded outcome','Session','Recorded by','Action'],[['<strong>Software Engineer</strong><small>Harbor Technologies</small>',badge('User reported submitted','blue'),'Lost · outcome retained','You · 18 Oct 2026','<button data-demo="Application history">View history</button>']]);
 if(current==='applications'&&subview==='Follow-ups')return `<section class="surface panel"><h2>Follow-up from a received request</h2><div class="row" style="margin-top:18px"><div class="symbol blue-symbol">${icon('inbox')}</div><div><h3>Harbor Technologies · application update</h3><p>A retained recruiter message asks for availability. No outreach timer or automatic message is active.</p></div><button data-go="inbox">Review conversation</button></div></section>`;
 if(current==='inbox'&&subview==='Job Alerts')return `<div class="inline-note" style="margin:0 0 16px">${icon('shield')}Unverified leads are not eligible jobs. Verify the direct employer vacancy first.</div>${table(['Received lead','Employer verification','Research state','Next step'],[['Frontend opportunities · weekly alert',badge('Unknown','warn'),'Exact vacancy not retained','<button data-demo="Lead verification">Inspect lead</button>'],['Senior Web Engineer · Northstar',badge('Needs official listing','warn'),'Possible direct listing · identity unresolved','<button data-demo="Lead verification">Review evidence</button>']])}`;
 if(current==='inbox'&&subview==='Draft Approvals')return `<div class="surface inbox-layout"><div class="inbox-list"><div class="inbox-toolbar">2 local drafts awaiting review</div><button class="conversation active"><h3>Solstice · interview availability</h3><p>Local text prepared · no Gmail draft exists</p>${badge('Recipient unverified','warn')}</button><button class="conversation"><h3>Atlas · screening response</h3><p>Preview changed · approval required again</p>${badge('Not approved')}</button></div><article class="inbox-detail"><div class="tags">${badge('Local preview only','blue')}${badge('Approval blocked','warn')}</div><h2>Re: Interview availability</h2><div class="message-explanation"><strong>Recipient verification required</strong>demo-recipient@example.invalid · illustrative address only. A verified role-related source and exact snapshot are required.</div><div class="message-body"><p>Hi Kira,</p><p>Thank you for reaching out. I would be happy to discuss the role. I can share availability after confirming the interview details.</p><p>Best,<br>Jordan</p></div><div class="detail-actions"><button data-demo="Edit local text">Edit local text</button><button disabled>Approve exact unsent draft</button></div><p class="small muted">Changes to recipient, subject, body or attachments invalidate approval. Sending is never automatic.</p></article></div>`;
 if(current==='inbox'&&subview==='Draft History')return table(['Conversation','Durable operation','Returned Gmail ID','Updated'],[['Solstice · local reply text',badge('No Gmail operation'),'None · local text only','Today, 10:15'],['Atlas · preview revised',badge('Approval invalidated','warn'),'None · never created','Today, 09:40']]);
 if(current==='sources'&&subview==='Run History')return table(['Run','Stages','Outcome','Retained evidence'],[['#042 · today 10:28','6 source checks',badge('Completed with warning','warn'),'14 roles · one timeout · checkpoint retained'],['#041 · yesterday 10:15','5 source checks',badge('Completed','good'),'8 roles · all source outcomes retained']]);
 if(current==='sources'&&subview==='Schedules')return `<div class="metrics">${metric('Active schedules','0','Nothing activated','calendar')}${metric('Stored plans','1','Configuration only','file')}${metric('OS registration','Unknown','Not detected or inferred','shield')}${metric('Next promised run','None','Eligibility is not execution','clock')}</div>${table(['Plan','Stage','State','Registration','Action'],[['Daily discovery · 08:00 IST','Discovery',badge('Disabled'),'Not verified','<button data-demo="Inspect disabled plan">View configuration</button>']])}<div class="inline-note">${icon('shield')}Schedule activation is outside this design review and requires separate authorization.</div>`;
 if(current==='sources'&&subview==='Verification Backlog')return table(['Owner','Unresolved evidence','Blocked roles','Next action'],[['Agent research','Direct permanent employment',badge('8 unknown','warn'),'Official employer evidence required'],['Agent research','Mandatory requirement completeness',badge('6 unknown','warn'),'Review exact source clauses'],['Agent research','Official vacancy identity',badge('4 unknown','warn'),'Match received lead to canonical listing']]);
 if(current==='profile'&&subview==='Documents')return `<div class="grid-two"><section class="surface panel"><div class="panel-heading"><h2>Canonical resume</h2>${badge('Available','good')}</div><div class="row"><div class="symbol">${icon('file')}</div><div><h3>Approved resume.pdf</h3><p>Local reference · original bytes retained<br>Availability checked today at 09:54 IST</p></div></div><div class="detail-actions"><button data-demo="View local reference">View reference</button><button data-demo="Explicit local parsing">Parse locally</button></div><p class="small muted">Parsing requires a deliberate click. Proposals need your acceptance.</p></section><section class="surface panel"><h2>Supporting documents</h2><div class="row" style="margin-top:18px"><div class="symbol">${icon('file')}</div><div><h3>Approved cover letter.pdf</h3><p>Local reference available · never modified automatically</p></div></div><div class="inline-note">${icon('shield')}Private answer bank is never uploaded.</div></section></div>`;
 if(current==='profile'&&subview==='Saved Answers')return table(['Question','Saved answer','Scope','Provenance','Action'],[['Preferred work mode','Remote or hybrid','Global preference','Explicit user answer · 15 Oct','<button data-demo="Edit scoped answer">Review</button>'],['Notice period','Not confirmed',badge('Employer-specific','warn'),'No accepted answer for Northstar','<button data-demo="Add scoped answer">Add answer</button>']]);
 if(current==='profile'&&subview==='Preferences')return `<div class="grid-two"><section class="surface panel"><h2>Search preferences</h2><div class="fact-row"><span class="fact-label">Target roles</span><span class="fact-value">Senior Frontend Engineer · Frontend Platform</span></div><div class="fact-row"><span class="fact-label">Locations</span><span class="fact-value">India · Remote · Bengaluru · Pune</span></div><div class="fact-row"><span class="fact-label">Work modes</span><span class="fact-value">Remote · Hybrid</span></div><button data-demo="Edit matching preferences" style="margin-top:18px">Edit preferences</button></section><section class="surface panel"><h2>Notifications</h2><div class="fact-row"><span class="fact-label">Batch sound</span><span class="fact-value">Off in prototype</span></div><div class="fact-row"><span class="fact-label">Quiet hours</span><span class="fact-value">22:00–08:00 IST</span></div><div class="inline-note">${icon('shield')}Preferences guide matching; they never assert candidate experience.</div></section></div>`;
 return apps();
}
function render(){const w=workspaces.find(w=>w.id===current);el('current-title').textContent=w.name;document.querySelector('.nav').innerHTML=workspaces.map(n=>`<button data-go="${n.id}" class="${n.id===current?'active':''}" aria-label="${n.name}" ${n.id===current?'aria-current="page"':''} title="${n.name}">${icon(n.icon)}<span>${n.name}</span>${n.id==='inbox'?'<span class="count">3</span>':''}</button>`).join('');document.querySelector('.header-search').innerHTML=icon('search')+`<input aria-label="Search loaded ${w.name.toLowerCase()}" placeholder="Search loaded ${w.name.toLowerCase()}…">`;const mainView={home:'Overview',jobs:'Best Matches',applications:'Preparing',inbox:'Recruiter Inbox',sources:'Source Health',profile:'Career Facts'};el('workspace').innerHTML=heading(w,subview)+(subview===mainView[current]?({home,jobs,applications:apps,inbox,sources,profile}[current])():alternate());document.querySelector('.header-search input').addEventListener('input',e=>{const notice=el('search-feedback');notice.textContent=e.target.value?`Prototype search: “${e.target.value}” · illustrative loaded records only. No external search is performed.`:'';notice.classList.toggle('visible',!!e.target.value);});}
function showDemo(title){el('dialog-title').textContent=title;el('dialog-body').innerHTML=`<p>This is a design preview. No data, account or employer form will be changed.</p><p>The production implementation will retain the existing exact approval, eligibility, audit, persistence and manual submission controls.</p>`;el('proposal-dialog').showModal()}
function closeMenu(){document.body.classList.remove('menu-open');document.querySelector('.mobile-menu').setAttribute('aria-expanded','false');document.querySelector('.sidebar').removeAttribute('role');document.querySelector('.sidebar').removeAttribute('aria-modal');document.querySelector('.mobile-menu').focus()}
function navigate(){const [id,slug]=location.hash.slice(1).split('/');const w=workspaces.find(w=>w.id===id)||workspaces[0];current=w.id;subview=w.views.find(v=>v.toLowerCase().replaceAll(' ','-')===slug)||({home:'Overview',jobs:'Best Matches',applications:'Preparing',inbox:'Recruiter Inbox',sources:'Source Health',profile:'Career Facts'})[current];render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const target=e.target.closest('button,a');if(!target)return;if(target.dataset.go){const view=target.dataset.sub||({home:'Overview',jobs:'Best Matches',applications:'Preparing',inbox:'Recruiter Inbox',sources:'Source Health',profile:'Career Facts'})[target.dataset.go];location.hash=target.dataset.go+'/'+view.toLowerCase().replaceAll(' ','-');if(document.body.classList.contains('menu-open'))closeMenu()}if(target.dataset.view)location.hash=current+'/'+target.dataset.view.toLowerCase().replaceAll(' ','-');if(target.dataset.demo){e.preventDefault();showDemo(target.dataset.demo)}if(target.dataset.role!==undefined){document.querySelectorAll('[data-role]').forEach(n=>{n.classList.toggle('selected',n===target);n.setAttribute('aria-pressed',String(n===target))});el('role-detail').innerHTML=roleDetail(Number(target.dataset.role))}if(target.dataset.conversation!==undefined){document.querySelectorAll('[data-conversation]').forEach(n=>n.classList.toggle('active',n===target));el('conversation-detail').innerHTML=conversationDetail(Number(target.dataset.conversation))}});
document.querySelector('.collapse').innerHTML=icon('chevron')+'<span>Collapse sidebar</span>';document.querySelector('.collapse').onclick=()=>{if(innerWidth<640){closeMenu();return}document.body.classList.toggle('collapsed');const collapsed=document.body.classList.contains('collapsed');document.querySelector('.collapse').setAttribute('aria-label',collapsed?'Expand sidebar':'Collapse sidebar');};document.querySelector('.mobile-menu').innerHTML=icon('menu');document.querySelector('.mobile-menu').onclick=()=>{document.body.classList.add('menu-open');document.querySelector('.mobile-menu').setAttribute('aria-expanded','true');document.querySelector('.sidebar').setAttribute('role','dialog');document.querySelector('.sidebar').setAttribute('aria-modal','true');document.querySelector('.nav button.active').focus()};document.querySelector('.menu-backdrop').onclick=closeMenu;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('menu-open'))closeMenu();if(e.key==='Tab'&&document.body.classList.contains('menu-open')){const buttons=[...document.querySelectorAll('.sidebar button')];if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===buttons.at(-1)){e.preventDefault();buttons[0].focus()}}});el('notifications').innerHTML=icon('bell')+'<span class="notification-dot"></span>';el('settings').innerHTML=icon('settings');el('notifications').onclick=()=>showDemo('Notifications · 3 items need attention');el('settings').onclick=()=>showDemo('Workspace settings');el('dialog-close').onclick=()=>el('proposal-dialog').close();window.addEventListener('hashchange',navigate);navigate();
</script>
